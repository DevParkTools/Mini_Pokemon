<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>미니 몬스터 골드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
html,body{margin:0;height:100%;background:#0b0b10;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:grid;background:#0b0b10;--u:140px}
#wrap.noctl{grid-template:"s" 1fr/1fr}
#wrap.port{grid-template:"s s" auto "l r" 1fr/1fr 1fr}
#wrap.land{grid-template:"l s r" 1fr/1fr auto 1fr}
#stage{grid-area:s;display:flex;align-items:center;justify-content:center}
#left{grid-area:l;position:relative}
#right{grid-area:r;position:relative;--b:calc(var(--u)*.5)}
#wrap.noctl #left,#wrap.noctl #right{display:none}
#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#joy{position:absolute;left:50%;top:50%;width:var(--u);height:var(--u);margin:calc(var(--u)/-2) 0 0 calc(var(--u)/-2);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.28);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(255,255,255,.38);border:2px solid rgba(255,255,255,.6);pointer-events:none}
.btn{position:absolute;width:var(--b);height:var(--b);border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.38);color:#fff;font:bold calc(var(--b)*.4)/1 sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.on,.pill.on{background:rgba(255,255,255,.4)}
#bA{right:7%;top:26%}
#bB{right:calc(7% + var(--b)*1.2);top:48%}
#topbar{position:fixed;top:6px;right:6px;z-index:9;display:flex;gap:5px}
.gear{padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.35);color:#fff;font:bold 12px sans-serif;touch-action:none;cursor:pointer}
.gear.on{background:rgba(255,255,255,.4)}
.pill{position:absolute;right:7%;bottom:8%;padding:.55em 1.1em;border-radius:999px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.38);color:#fff;font:bold 13px sans-serif;touch-action:none}
</style>
</head>
<body>
<div id="wrap" class="noctl">
<div id="left"><div id="joy"><div id="knob"></div></div></div>
<div id="stage"><canvas id="c" width="640" height="576"></canvas></div>
<div id="topbar"><div id="bI" class="gear">가방</div><div id="bK" class="gear">상태</div><div id="bS" class="gear">설정</div></div>
<div id="right"><div id="bB" class="btn">B</div><div id="bA" class="btn">A</div><div id="bM" class="pill">메뉴</div></div>
</div>
<script>
(()=>{
'use strict';
const W=160,H=144,TS=16,BOXY=100,BOXH=44;
let VW=160,OX=0;
const FB="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";
const FONT11="'Galmuri11',"+FB,FONT9="'Galmuri9','Galmuri11',"+FB;
const F7='8px '+FONT9,F8='9px '+FONT9,F9='11px '+FONT11,F20='bold 20px '+FONT11;
const DX=[0,0,-1,1],DY=[1,-1,0,0],OP=[1,0,3,2];
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),wrap=$('wrap'),joyEl=$('joy'),knob=$('knob'),leftEl=$('left');
const PN='우진',RN='도윤';
const S={snd:true,bgm:true,joy:0,fast:false,spd:1,vol:1,lock:false};
const MVF=[16,12,9],VOLM=[.5,1,1.6];
try{const raw=localStorage.getItem('mmg');if(raw){const o=JSON.parse(raw);if(typeof o.snd==='boolean')S.snd=o.snd;if(o.joy===0||o.joy===1||o.joy===2)S.joy=o.joy;if(typeof o.fast==='boolean')S.fast=o.fast;if(typeof o.bgm==='boolean')S.bgm=o.bgm;if(o.spd===0||o.spd===1||o.spd===2)S.spd=o.spd;if(o.vol===0||o.vol===1||o.vol===2)S.vol=o.vol;if(typeof o.lock==='boolean')S.lock=o.lock}}catch(e){}
function saveS(){try{localStorage.setItem('mmg',JSON.stringify(S))}catch(e){}}
if(document.fonts&&document.fonts.load){document.fonts.load('9px Galmuri9');document.fonts.load('11px Galmuri11')}

let AC=null,mg=null,NB=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C){AC=new C();mg=AC.createGain();mg.gain.value=.5*VOLM[S.vol];mg.connect(AC.destination);NB=AC.createBuffer(1,(AC.sampleRate*.2)|0,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}}if(AC&&AC.state==='suspended')AC.resume()}
function beep(f,t0,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;const t=AC.currentTime+t0;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02)}
const SFX={sel:[[880,0,.05]],ok:[[660,0,.06],[990,.06,.08]],hit:[[180,0,.09],[120,.07,.1]],lv:[[523,0,.1],[659,.1,.1],[784,.2,.1],[1047,.3,.25]],heal:[[523,0,.1],[784,.12,.1],[1047,.24,.2]],ball:[[440,0,.08],[330,.1,.08]],faint:[[300,0,.12],[220,.12,.12],[150,.24,.2]],step:[[220,0,.03]],excl:[[1250,0,.07],[1700,.08,.14]],talk:[[760,0,.04]],exp:[[1300,0,.015]],grass:[[300,0,.04],[380,.03,.04]]};
function sfx(n){if(!S.snd||!AC)return;const a=SFX[n];for(let i=0;i<a.length;i++)beep(a[i][0],a[i][1],a[i][2],'square',.06*VOLM[S.vol])}
const mf=m=>440*Math.pow(2,(m-69)/12);
const rep2=(a,n)=>{let o=[];for(let i=0;i<n;i++)o=o.concat(a);return o};
const CC=[[48,52,55],[45,48,52],[41,45,48],[43,47,50]];
function chordBass(cs){const o=[],p=[0,2,1,2,0,2,1,2];for(let i=0;i<cs.length;i++)for(let j=0;j<8;j++)o.push([cs[i][p[j]],.5]);return o}
const rn=(a,b,c)=>[[a,.5],[b,.5],[c,.5],[b,.5],[a,.5],[b,.5],[c,1]];
const ar=(a,b,c)=>[[a,1],[b,1],[c,1],[b,1]];
const bt=r=>[0,0,12,0,0,0,12,0].map(k=>[r+k,.5]);
const TRK={
field:{bpm:116,ch:[
{ty:'square',v:.03,r:.9,n:[[76,1],[79,1],[76,1],[72,1],[69,1],[72,1],[76,2],[77,1],[81,1],[77,1],[72,1],[74,2],[71,1],[67,1],[76,1],[79,1],[84,1],[79,1],[81,1],[76,1],[72,1],[69,1],[77,1],[76,1],[74,1],[72,1],[74,1],[71,1],[74,2]]},
{ty:'triangle',v:.07,r:.95,n:chordBass([CC[0],CC[1],CC[2],CC[3],CC[0],CC[1],CC[2],CC[3]])}]},
battle:{bpm:156,ch:[
{ty:'square',v:.028,r:.85,n:[].concat(rn(76,81,84),rn(74,79,83),rn(77,81,84),rn(76,80,83),ar(81,84,88),ar(79,83,86),ar(77,81,84),ar(80,83,88))},
{ty:'square',v:.035,r:.8,n:[].concat(bt(45),bt(43),bt(41),bt(40),bt(45),bt(43),bt(41),bt(40))},
{ty:'drum',v:1,r:1,n:rep2([[1,.5],[2,.5],[3,.5],[2,.5],[1,.5],[2,.5],[3,.5],[2,.5]],8)}]}
};
const mk={name:'',g:null,i:[0,0,0],nt:[0,0,0]};
function note(f,t,d,ty,v,dst){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dst);o.start(t);o.stop(t+d+.02)}
function drum(k,t,dst){
if(k===1){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(dst);o.start(t);o.stop(t+.16)}
else{const s=AC.createBufferSource(),g=AC.createGain();s.buffer=NB;g.gain.setValueAtTime(k===3?.09:.035,t);g.gain.exponentialRampToValueAtTime(.001,t+(k===3?.12:.04));s.connect(g);g.connect(dst);s.start(t);s.stop(t+.14)}}
function musTick(){
if(!AC||!mk.g)return;
const tr=TRK[mk.name],beat=60/tr.bpm,lim=AC.currentTime+.3;
for(let c=0;c<tr.ch.length;c++){
const ch=tr.ch[c];
while(mk.nt[c]<lim){
const n=ch.n[mk.i[c]];
if(ch.ty==='drum'){if(n[0])drum(n[0],mk.nt[c],mk.g)}
else if(n[0])note(mf(n[0]),mk.nt[c],n[1]*beat*ch.r,ch.ty,ch.v,mk.g);
mk.nt[c]+=n[1]*beat;mk.i[c]=(mk.i[c]+1)%ch.n.length}}}
function setTrack(w){
if(mk.g)mk.g.gain.setTargetAtTime(0,AC.currentTime,.03);
mk.name=w;
if(!w){mk.g=null;return}
mk.g=AC.createGain();mk.g.connect(mg);
const t=AC.currentTime+.08;
for(let c=0;c<3;c++){mk.i[c]=0;mk.nt[c]=t}}
function musUpdate(){
if(!AC)return;
const w=S.bgm?(mode==='battle'?'battle':'field'):'';
if(w!==mk.name)setTrack(w)}
setInterval(musTick,50);

const GRD=0,GRS=1,GRT=2,TRE=3,WAT=4,WAT2=5,FLW=6,ROR=7,WAL=8,WIN=9,DOR=10,SGN=11,FEN=12,FLR=13,IWL=14,MAT=15,TBL=16,CNT=17,BED=18,BKS=19,PLT=20,HEA=21,GYF=22,SHF=23,ROB=24,ROG=25,BLK=26,STA=27,STD=28,CAR=29,STT=30;
const SOL=new Uint8Array(32);
[TRE,WAT,WAT2,ROR,ROB,ROG,WAL,WIN,SGN,FEN,IWL,TBL,CNT,BED,BKS,PLT,HEA,SHF,BLK,STT].forEach(i=>{SOL[i]=1});

function mkTiles(){
const c=document.createElement('canvas');c.width=TS*31;c.height=TS;const g=c.getContext('2d');
const r=(i,x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(i*TS+x,y,w,h)};
const bs=(i,col)=>r(i,0,0,16,16,col);
const grass=i=>{bs(i,'#60c050');[[2,3],[9,1],[5,9],[12,12],[1,14],[13,6]].forEach(p=>{r(i,p[0],p[1],1,2,'#48a038');r(i,p[0]+1,p[1]+1,1,1,'#80d868')})};
bs(GRD,'#e8d8a8');[[3,4],[10,9],[6,13],[13,2],[1,10]].forEach(p=>r(GRD,p[0],p[1],2,1,'#d4c088'));
grass(GRS);
bs(GRT,'#3c9c44');for(let y=1;y<16;y+=5)for(let x=(y%2)*2;x<16;x+=4){r(GRT,x,y,1,4,'#1f6a2c');r(GRT,x+1,y+1,1,3,'#2c8438');r(GRT,x+2,y,1,1,'#80e070')}
grass(TRE);r(TRE,6,11,4,5,'#6a4020');r(TRE,3,2,10,9,'#2f7a2f');r(TRE,2,4,12,6,'#2f7a2f');r(TRE,5,1,6,2,'#2f7a2f');r(TRE,4,3,3,2,'#58a848');r(TRE,9,6,3,2,'#1f5a28');r(TRE,4,9,6,1,'#1f5a28');r(TRE,7,4,2,1,'#58a848');
bs(WAT,'#3c7cf0');r(WAT,2,4,5,1,'#8cc0ff');r(WAT,9,10,5,1,'#8cc0ff');r(WAT,11,3,3,1,'#8cc0ff');
bs(WAT2,'#3c7cf0');r(WAT2,5,5,5,1,'#8cc0ff');r(WAT2,1,11,5,1,'#8cc0ff');r(WAT2,10,2,3,1,'#8cc0ff');
grass(FLW);r(FLW,3,4,2,2,'#f84858');r(FLW,10,9,2,2,'#f8f8f8');r(FLW,11,3,2,2,'#f8d838');r(FLW,5,11,2,2,'#f84858');
const roof=(i,a,b,h)=>{bs(i,a);for(let y=3;y<16;y+=4){r(i,0,y,16,1,b);r(i,0,y-2,16,1,h)}};
roof(ROR,'#d84038','#a02828','#e86058');roof(ROB,'#3868c8','#284898','#5888e0');roof(ROG,'#38a858','#287838','#58c878');
bs(WAL,'#f4ecd4');r(WAL,0,15,16,1,'#c8b88c');r(WAL,0,0,16,1,'#e0d4b0');
bs(WIN,'#f4ecd4');r(WIN,0,15,16,1,'#c8b88c');r(WIN,3,3,10,8,'#585858');r(WIN,4,4,8,6,'#98d0f8');r(WIN,8,4,1,6,'#585858');r(WIN,4,7,8,1,'#585858');
bs(DOR,'#f4ecd4');r(DOR,3,2,10,14,'#7a4a28');r(DOR,4,3,8,13,'#9a6438');r(DOR,10,9,2,2,'#f8d860');
grass(SGN);r(SGN,7,9,2,6,'#8a5a30');r(SGN,2,3,12,7,'#e0b068');r(SGN,2,3,12,1,'#8a5a30');r(SGN,4,5,8,1,'#8a5a30');r(SGN,4,7,8,1,'#8a5a30');
grass(FEN);r(FEN,0,5,16,2,'#f0f0f0');r(FEN,0,10,16,2,'#f0f0f0');r(FEN,2,3,2,11,'#c8c8c8');r(FEN,12,3,2,11,'#c8c8c8');
const fl=i=>{bs(i,'#e0b070');r(i,0,7,16,1,'#c09050');r(i,0,15,16,1,'#c09050');r(i,5,0,1,7,'#c09050');r(i,11,8,1,7,'#c09050')};
fl(FLR);
bs(IWL,'#d8c8a8');r(IWL,0,0,16,2,'#b8a888');r(IWL,0,12,16,4,'#a89870');r(IWL,0,11,16,1,'#c0b090');r(IWL,7,4,2,5,'#c0b090');
fl(MAT);r(MAT,1,2,14,12,'#d04040');r(MAT,2,3,12,10,'#e86060');r(MAT,1,2,14,1,'#f8d8a8');
fl(TBL);r(TBL,0,3,16,12,'#8a5a30');r(TBL,0,3,16,3,'#c08848');r(TBL,0,13,16,2,'#6a4020');
fl(CNT);r(CNT,0,2,16,13,'#a8b0c8');r(CNT,0,2,16,3,'#f0f0f8');r(CNT,0,14,16,1,'#707890');
fl(BED);r(BED,1,1,14,14,'#f8f8f8');r(BED,1,6,14,9,'#e86868');r(BED,1,1,14,1,'#a8a8a8');r(BED,3,2,10,3,'#d8e8f8');
bs(BKS,'#6a4020');r(BKS,1,1,14,6,'#3a2010');r(BKS,1,9,14,6,'#3a2010');const bc=['#d04040','#4060d0','#e0c030','#40a060'];for(let i=0;i<6;i++){r(BKS,2+i*2,2,2,5,bc[i%4]);r(BKS,2+i*2,10,2,5,bc[(i+2)%4])}
fl(PLT);r(PLT,4,10,8,5,'#c06830');r(PLT,3,2,10,9,'#38a040');r(PLT,5,0,6,5,'#58c058');
fl(HEA);r(HEA,1,2,14,12,'#c0c8d8');r(HEA,2,3,12,5,'#f0f0f8');r(HEA,3,4,3,3,'#e04040');r(HEA,7,4,3,3,'#e04040');r(HEA,11,4,3,3,'#e04040');r(HEA,1,13,14,1,'#808898');
bs(GYF,'#dfe4f0');r(GYF,0,0,8,8,'#bcc8e0');r(GYF,8,8,8,8,'#bcc8e0');
bs(SHF,'#7a4a28');r(SHF,1,1,14,14,'#a06a38');r(SHF,2,2,3,4,'#e04040');r(SHF,6,2,3,4,'#4060e0');r(SHF,10,2,3,4,'#f0d040');r(SHF,2,9,3,4,'#40c060');r(SHF,6,9,3,4,'#e08030');r(SHF,10,9,3,4,'#e04040');
bs(BLK,'#000');
const stair=(i,up)=>{bs(i,'#2a2430');r(i,1,1,14,14,'#503c28');for(let y=2;y<14;y+=3){r(i,2,y,12,1,'#f8e0a0');r(i,2,y+1,12,2,'#c08840')}
const a=(dx,dy,c)=>{if(up){r(i,7+dx,3+dy,2,1,c);r(i,6+dx,4+dy,4,1,c);r(i,5+dx,5+dy,6,1,c);r(i,4+dx,6+dy,8,1,c);r(i,6+dx,7+dy,4,5,c)}else{r(i,6+dx,3+dy,4,5,c);r(i,4+dx,8+dy,8,1,c);r(i,5+dx,9+dy,6,1,c);r(i,6+dx,10+dy,4,1,c);r(i,7+dx,11+dy,2,1,c)}};
a(1,1,'#201000');a(0,0,'#ffd820')};
stair(STA,true);stair(STD,false);
bs(CAR,'#f0c040');r(CAR,2,0,12,16,'#d03848');r(CAR,5,0,6,16,'#b82030');r(CAR,7,0,2,16,'#e86070');
bs(STT,'#dfe4f0');r(STT,0,0,8,8,'#bcc8e0');r(STT,8,8,8,8,'#bcc8e0');
r(STT,3,12,10,3,'#707890');r(STT,4,10,8,3,'#a0a8c0');r(STT,6,4,4,7,'#8890a8');r(STT,2,6,12,2,'#8890a8');r(STT,1,7,3,2,'#707890');r(STT,12,7,3,2,'#707890');r(STT,7,1,3,4,'#8890a8');r(STT,10,2,3,1,'#f0c040');r(STT,8,2,1,1,'#202028')
return c}

function outline(c){
const w=c.width,h=c.height,g=c.getContext('2d'),d=g.getImageData(0,0,w,h).data;
g.fillStyle='#202028';
for(let y=0;y<h;y++)for(let x=0;x<w;x++){
if(d[(y*w+x)*4+3]!==0)continue;
if((x>0&&d[(y*w+x-1)*4+3]>0)||(x<w-1&&d[(y*w+x+1)*4+3]>0)||(y>0&&d[((y-1)*w+x)*4+3]>0)||(y<h-1&&d[((y+1)*w+x)*4+3]>0))g.fillRect(x,y,1,1)}}

const CH={
pl:{hair:'#383838',skin:'#f8c8a0',sh:'#e03838',pa:'#304880',hat:'#e03838'},
mom:{hair:'#7a4020',skin:'#f8c8a0',sh:'#f088a8',pa:'#f088a8'},
prof:{hair:'#d0d0d0',skin:'#f8c8a0',sh:'#f8f8f8',pa:'#686868'},
rival:{hair:'#c83030',skin:'#f8c8a0',sh:'#383848',pa:'#505068'},
girl:{hair:'#e8a030',skin:'#f8c8a0',sh:'#f8a8d0',pa:'#8858c0'},
boy:{hair:'#383838',skin:'#f8c8a0',sh:'#40a860',pa:'#386838',hat:'#40a860'},
clerk:{hair:'#383838',skin:'#f8c8a0',sh:'#4878d8',pa:'#304880',hat:'#4878d8'},
nurse:{hair:'#f070a0',skin:'#f8c8a0',sh:'#f8f8f8',pa:'#f8d0e0',hat:'#f8f8f8'},
leader:{hair:'#684020',skin:'#f8c8a0',sh:'#80b8f0',pa:'#f0f0f0'},
old:{hair:'#d0d0d0',skin:'#e8b890',sh:'#a07858',pa:'#604830'}
};
function drawCh(g,p,dd,l1,l2){
const f=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
if(dd===0){
if(p.hat){f(4,1,8,4,p.hat);f(5,4,6,1,'#00000033')}else f(4,2,8,3,p.hair);
f(5,5,6,4,p.skin);f(6,6,1,2,'#181818');f(9,6,1,2,'#181818');
f(3,9,1,4,p.sh);f(12,9,1,4,p.sh);f(4,9,8,4,p.sh);f(3,12,1,1,p.skin);f(12,12,1,1,p.skin);
}else if(dd===1){
f(4,2,8,7,p.hair);if(p.hat)f(4,1,8,4,p.hat);
f(3,9,1,4,p.sh);f(12,9,1,4,p.sh);f(4,9,8,4,p.sh);f(3,12,1,1,p.skin);f(12,12,1,1,p.skin);
}else{

function updNpcs(){

yield* say('어서 오세요! 상처약과 몬스터볼을 팔고 있어요.');
yield* shopScreen();
yield* say('또 오세요!')}
function* talkCityMom(){
if(G.flags.cityGift){yield* say('아주머니: 모험 잘하고 있니? 몸조심하렴!');return}
G.flags.cityGift=true;
yield* say('아주머니: 어머, 모험가구나! 이거 가져가렴.');
G.bag[0]+=3;sfx('ok');
yield* say(eunn(PN)+' 상처약 3개를 받았다!')}
function* talkLeader(n){
if(!G.flags.leader&&!(G.flags.d_gt1&&G.flags.d_gt2&&G.flags.d_gt3)){yield* say('하늘: 도전자 세 명을 먼저 쓰러뜨리고 오렴!');return}
if(G.flags.leader){yield* say('하늘: 훌륭한 트레이너야! 앞으로도 멋진 모험을 이어 가렴!');return}
yield* say('하늘: 잘 왔다! 나는 청록시 체육관 관장 하늘!');
yield* say('하늘: 하늘을 가르는 새 몬스터들의 힘을 보여 주마!');
const r=yield* fight([mkMon(6,7),mkMon(7,9)],{name:'관장 하늘',ch:'leader',rw:500,lose:'하늘: 내가 졌다... 훌륭한 승부였다!'});
if(r!=='win')return;
G.flags.leader=true;
sfx('lv');
yield* say('하늘: 승리의 증표로 윙배지를 주마. 받아라!');
yield* say(eunn(PN)+' 윙배지를 손에 넣었다!');
yield* ending()}
function* ending(){
yield* fade(1,20);
mode='ending';
yield* fade(0,20);
yield* say('관장 하늘을 쓰러뜨리고 모험을 완수했다!',0);
yield* say('플레이해 주셔서 감사합니다! 수고하셨어요!',0);
const i=yield* menu(['계속 탐험하기','처음부터 다시 시작'],24,100,112,1,false,0);
yield* fade(1,16);
if(i===1){resetGame();return}
mode='world';
yield* fade(0,16)}
function* intro(){
fadeA=1;yield* fade(0,24);
yield* say(PN+': 으음... 벌써 아침이네. 1층으로 내려가 볼까?');
yield* say('이동: 방향키 / 조이스틱\nA(Z): 확인·대화\nB(X): 메뉴·취소\n설정: 우상단 버튼 (P키)')}
const SAVEK='mmgs';
function saveGame(){
try{
localStorage.setItem(SAVEK,JSON.stringify({G,m:cur.k,x:P1.x,y:P1.y,d:P1.d}));
return true}catch(e){return false}}
function readSave(){
try{const t=localStorage.getItem(SAVEK);return t?JSON.parse(t):null}catch(e){return null}}
function applyFlags(){
const f=G.flags;
npcById(world.town,'rivalT').vis=!f.guided;
npcById(world.lab,'rival1').vis=!f.rival1;
npcById(world.route,'rival2').vis=!f.rival2}
function* loadIn(){fadeA=1;yield* fade(0,16)}
function loadGame(sv){
const g=Object.assign(newG(),sv.G);
if(!Array.isArray(g.party)||!Array.isArray(g.box))return false;
G=g;
for(let i=0;i<G.party.length;i++)dexC(G.party[i]);
for(let i=0;i<G.box.length;i++)dexC(G.box[i]);
P1=newP();world=buildWorld();applyFlags();
areaT='';ban.f=0;ui.heal=null;ui.lvup=null;
ui.dlg=null;ui.menu=null;ui.scr=null;ui.money=false;ui.evo=null;ui.end=null;
B=null;excl=null;flash=0;fadeA=1;mode='world';
enterMap(world[sv.m]?sv.m:'town',sv.x,sv.y,sv.d);
script=loadIn();
return true}
function* titleScript(){
mode='title';fadeA=0;
for(;;){yield;if(P.s){ac();const r=yield* settings();if(r==='restart')return}if(P.a||P.m){ac();sfx('ok');break}}
const sv=readSave();
if(sv){
const i=yield* menu(['이어하기','새로 시작'],44,62,72,1,false,0);
if(i===0){
yield* fade(1,14);
let ok=false;
try{ok=loadGame(sv)}catch(e){ok=false}
if(ok)return}}
yield* fade(1,14);
resetGame()}
function resetGame(){
G=newG();P1=newP();world=buildWorld();
areaT='';ban.f=0;ui.heal=null;ui.lvup=null;
ui.dlg=null;ui.menu=null;ui.scr=null;ui.money=false;ui.evo=null;ui.end=null;
B=null;excl=null;flash=0;fadeA=1;mode='world';
enterMap('home2',3,2,0);
script=intro()}

const TOUCH=('ontouchstart' in window)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
function showCtl(){return S.joy===1||(S.joy===0&&TOUCH)}
function resize(){
const vw=innerWidth,vh=innerHeight,sc=showCtl(),port=vh>vw;
wrap.className=sc?(port?'port':'land'):'noctl';
let aw=vw,ah=vh;
if(sc){if(port)ah=vh-Math.min(300,vh*.4);else aw=vw-2*Math.min(150,vw*.16)}
let tv=Math.round(H*aw/ah);tv=Math.max(W,Math.min(288,tv));tv-=tv%2;
VW=tv;OX=(VW-W)/2;
const s=Math.min(aw/VW,ah/H);
cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(H*s)+'px';
K=Math.max(2,Math.min(8,Math.round(s*(window.devicePixelRatio||1))));
if(cv.width!==VW*K||cv.height!==H*K){cv.width=VW*K;cv.height=H*K}
if(sc){const r=leftEl.getBoundingClientRect();const u=Math.max(80,Math.min(170,Math.min(r.width,r.height)*.86));wrap.style.setProperty('--u',u+'px')}}

let joyId=-1,jcx=0,jcy=0,jr=1;
function joyUpdate(e){
const dx=e.clientX-jcx,dy=e.clientY-jcy,m=Math.hypot(dx,dy),lim=jr*.6,k=m>lim?lim/m:1;
knob.style.transform='translate('+dx*k+'px,'+dy*k+'px)';
let d=-1;
if(m>jr*.28){const ax=Math.abs(dx),ay=Math.abs(dy);const hz=(joyDir===2||joyDir===3)?ax>ay*.7:ax>ay*1.4;d=hz?(dx>0?3:2):(dy>0?0:1)}
joyDir=d}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();ac();joyId=e.pointerId;joyEl.setPointerCapture(e.pointerId);const r=joyEl.getBoundingClientRect();jcx=r.left+r.width/2;jcy=r.top+r.height/2;jr=r.width/2;joyUpdate(e)});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyUpdate(e)});
const joyEnd=e=>{if(e.pointerId===joyId){joyId=-1;joyDir=-1;knob.style.transform='translate(0px,0px)'}};
joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
function bindBtn(el,fn){
el.addEventListener('pointerdown',e=>{e.preventDefault();ac();el.setPointerCapture(e.pointerId);el.classList.add('on');fn(true)});
const end=()=>{el.classList.remove('on');fn(false)};
el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
bindBtn($('bA'),v=>{if(v)P.a=true;Hd.a=v});
bindBtn($('bB'),v=>{if(v)P.b=true});
bindBtn($('bM'),v=>{if(v)P.m=true});
bindBtn($('bS'),v=>{if(v)P.s=true});
bindBtn($('bI'),v=>{if(v)P.i=true});
bindBtn($('bK'),v=>{if(v)P.k=true});
cv.addEventListener('pointerdown',()=>{ac();if(mode==='title')P.a=true});
document.addEventListener('contextmenu',e=>e.preventDefault());
const KM={ArrowUp:1,KeyW:1,ArrowDown:0,KeyS:0,ArrowLeft:2,KeyA:2,ArrowRight:3,KeyD:3};
window.addEventListener('keydown',e=>{
ac();const c=e.code;
if(c in KM){e.preventDefault();const d=KM[c];if(dirs.indexOf(d)<0)dirs.push(d);return}
if(c==='KeyZ'||c==='Enter'||c==='Space'){e.preventDefault();if(!e.repeat)P.a=true;Hd.a=true}
else if(c==='KeyX'||c==='Escape'||c==='Backspace'){e.preventDefault();if(!e.repeat)P.b=true}
else if(c==='KeyM'||c==='KeyC'){if(!e.repeat)P.m=true}
else if(c==='KeyP'){if(!e.repeat)P.s=true}
else if(c==='KeyI'){if(!e.repeat)P.i=true}
else if(c==='KeyK'){if(!e.repeat)P.k=true}});
window.addEventListener('keyup',e=>{
const c=e.code;
if(c in KM){const i=dirs.indexOf(KM[c]);if(i>=0)dirs.splice(i,1)}
else if(c==='KeyZ'||c==='Enter'||c==='Space')Hd.a=false});
window.addEventListener('blur',()=>{dirs.length=0;Hd.a=false;joyDir=-1});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));

function step(){
fr++;readInput();musUpdate();
if(mode!=='title'&&G)G.t++;
if(B){if(B.bp>0)B.bp--;if(B.bf>0)B.bf--;if(B.lp>0)B.lp--;if(B.lf>0)B.lf--}
if(P.s&&!script&&mode==='world'&&G)script=settingsOnly();
if(P.i&&!script&&mode==='world'&&G)script=bagOnly();
if(P.k&&!script&&mode==='world'&&G)script=monOnly();
if(script){const s=script,r=s.next();if(r.done&&script===s)script=null}
else if(mode==='world'&&G)updWorld();
if(mode==='world'){grassUpd();if(ban.f>0)ban.f--}
P.a=false;P.b=false;P.m=false;P.s=false;P.i=false;P.k=false}
let last=0,acc=0;
function loop(t){
requestAnimationFrame(loop);
acc+=Math.min(100,t-last);last=t;
while(acc>=16.667){acc-=16.667;step()}
alpha=acc/16.667;
render()}
resize();
script=titleScript();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
